# Single-server deployment: PostgreSQL, Redis, S3 object store, API (+UI), collection workers, scheduler.
#   cp .env.example .env        # set every password
#   ./deploy/init-secrets.sh    # creates secrets/master.key
#   docker compose up -d --build
#   open http://localhost:8000  (user "admin", password ASSURANCE_BOOTSTRAP_ADMIN_PASSWORD)

x-app: &app
  image: assurance:${ASSURANCE_VERSION:-0.1.0}
  build: .
  restart: unless-stopped
  init: true
  env_file: .env
  environment:
    ASSURANCE_ENV: prod
    ASSURANCE_DATABASE_URL: postgresql+psycopg://assurance:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/assurance
    ASSURANCE_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    ASSURANCE_OBJECT_STORE: s3
    ASSURANCE_S3_ENDPOINT_URL: ${ASSURANCE_S3_ENDPOINT_URL:-http://objectstore:8333}
    ASSURANCE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-assurance}
    ASSURANCE_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    ASSURANCE_MASTER_KEY_FILE: /run/secrets/master_key
    ASSURANCE_JOB_BACKEND: rq
  secrets: [master_key]
  read_only: true
  tmpfs: [/tmp, /home/assurance]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    objectstore: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assurance
      POSTGRES_USER: assurance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assurance -d assurance"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      retries: 20

  # Bundled S3-compatible store (SeaweedFS) for raw command output. Any S3 API store works instead
  # (MinIO, Ceph RGW, AWS S3, StorageGRID): set ASSURANCE_S3_ENDPOINT_URL and drop this service.
  # Its access keys are in secrets/s3.json, written by deploy/init-secrets.sh from .env.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/run/secrets/s3_config",
              "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    secrets: [s3_config]
    volumes: [objdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 30

  migrate:
    <<: *app
    restart: "no"
    command: ["assurance-admin", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    ports: ["${ASSURANCE_PORT:-8000}:8000"]

  worker:
    <<: *app
    command: ["assurance-admin", "worker"]
    deploy:
      replicas: ${ASSURANCE_WORKERS:-2}
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["assurance-admin", "scheduler"]
    healthcheck:
      disable: true

secrets:
  master_key:
    file: ./secrets/master.key
  s3_config:
    file: ./secrets/s3.json

volumes:
  pgdata:
  redisdata:
  objdata:
