[project]
name = "assurance"
version = "0.5.0"
description = "Standalone network snapshot and change assurance for Cisco IOS-XE and NX-OS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pyats[library]>=26.0,<27",   # Genie parsers + Unicon connections; pinned per major
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "rq>=1.16",
  "redis>=5",
  "boto3>=1.34",
  "croniter>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "paramiko>=3.4",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "fakeredis>=2.23", "hypothesis>=6.100"]

[project.scripts]
assurance = "assurance.cli.client:main"
assurance-admin = "assurance.cli.admin:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assurance*"]

[tool.setuptools.package-data]
assurance = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S110", "S311", "S105", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"assurance/migrations/*" = ["E501", "I001", "UP"]

[tool.coverage.run]
source = ["assurance"]
omit = ["assurance/cli/admin.py", "assurance/migrations/*"]
