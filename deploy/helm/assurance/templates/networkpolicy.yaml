{{- if .Values.networkPolicy.enabled }}
# Base: no pod of this release takes connections, and egress is DNS plus the allowed destinations.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "assurance.fullname" . }}
  labels: {{- include "assurance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "assurance.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- if .Values.networkPolicy.egressCIDRs }}
    - to:
        {{- range .Values.networkPolicy.egressCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
    {{- else }}
    - {}
    {{- end }}
---
# Exception: the API takes HTTP (UI, API clients, ingress controller, Prometheus).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "assurance.fullname" . }}-api
  labels: {{- include "assurance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "assurance.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8000, protocol: TCP }]
      {{- with .Values.networkPolicy.apiFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
