{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "assurance.fullname" . }}
  labels: {{- include "assurance.labels" . | nindent 4 }}
  annotations:
    # Created before the migration hook, which needs it. Kept on uninstall: it holds the master key.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required (or set existingSecret)" $s.databaseUrl | quote }}
  redis-url: {{ required "secrets.redisUrl is required (or set existingSecret)" $s.redisUrl | quote }}
  s3-access-key: {{ required "secrets.s3AccessKey is required (or set existingSecret)" $s.s3AccessKey | quote }}
  s3-secret-key: {{ required "secrets.s3SecretKey is required (or set existingSecret)" $s.s3SecretKey | quote }}
  master-key: {{ required "secrets.masterKey is required (or set existingSecret)" $s.masterKey | quote }}
  {{- with $s.bootstrapAdminPassword }}
  bootstrap-admin-password: {{ . | quote }}
  {{- end }}
  {{- with $s.webhookSecret }}
  webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with $s.oidcClientSecret }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
  {{- with $s.smtpPassword }}
  smtp-password: {{ . | quote }}
  {{- end }}
{{- end }}
