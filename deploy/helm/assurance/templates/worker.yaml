{{- $c := dict "root" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assurance.fullname" . }}-worker
  labels: {{- include "assurance.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "assurance.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "assurance.selector" $c | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      {{- include "assurance.podCommon" $c | nindent 6 }}
      # RQ finishes the device job in hand on SIGTERM (warm shutdown) before exiting.
      terminationGracePeriodSeconds: 600
      containers:
        - name: worker
          image: {{ include "assurance.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["assurance-admin", "worker"]
          env: {{- include "assurance.env" . | nindent 12 }}
          volumeMounts: {{- include "assurance.mounts" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes: {{- include "assurance.volumes" . | nindent 8 }}
---
{{- $s := dict "root" . "component" "scheduler" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assurance.fullname" . }}-scheduler
  labels: {{- include "assurance.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "assurance.selector" $s | nindent 6 }}
  template:
    metadata:
      labels: {{- include "assurance.selector" $s | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      {{- include "assurance.podCommon" $s | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: {{ include "assurance.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["assurance-admin", "scheduler"]
          env: {{- include "assurance.env" . | nindent 12 }}
          volumeMounts: {{- include "assurance.mounts" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.scheduler.resources | nindent 12 }}
      volumes: {{- include "assurance.volumes" . | nindent 8 }}
