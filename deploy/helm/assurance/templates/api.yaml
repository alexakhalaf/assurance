{{- $c := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assurance.fullname" . }}-api
  labels: {{- include "assurance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "assurance.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "assurance.selector" $c | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      {{- include "assurance.podCommon" $c | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "assurance.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "--factory", "assurance.api.app:create_app", "--host", "0.0.0.0", "--port", "8000",
                 "--no-server-header", "--timeout-graceful-shutdown", "20"]
          ports: [{ name: http, containerPort: 8000 }]
          env: {{- include "assurance.env" . | nindent 12 }}
          volumeMounts: {{- include "assurance.mounts" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes: {{- include "assurance.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "assurance.fullname" . }}
  labels: {{- include "assurance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "assurance.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.service.port }}, targetPort: http }
