{{- range $name := list "api" "worker" }}
{{- $v := index $.Values $name }}
{{- $c := dict "root" $ "component" $name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "assurance.fullname" $ }}-{{ $name }}
  labels: {{- include "assurance.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $v.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "assurance.selector" $c | nindent 6 }}
{{- if $v.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "assurance.fullname" $ }}-{{ $name }}
  labels: {{- include "assurance.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "assurance.fullname" $ }}-{{ $name }}
  minReplicas: {{ $v.autoscaling.minReplicas }}
  maxReplicas: {{ $v.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $v.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
{{- if gt (int .Values.scheduler.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "assurance.fullname" . }}-scheduler
  labels: {{- include "assurance.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "assurance.selector" (dict "root" . "component" "scheduler") | nindent 6 }}
{{- end }}
