name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assurance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/assurance_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      # pg_dump/pg_restore must match the server (16), as in the image; a newer client writes
      # settings a 16 server rejects.
      - run: |
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pip install -c constraints.txt -e '.[dev]' pip-audit
      - run: ruff check assurance tests
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80
      # Blocking. The ignored advisories are in packages pyATS pins (python-socketio/engineio for its
      # log viewer, setuptools for easypy). Assurance never starts those servers or builds packages at
      # runtime; drop each ignore once pyATS lifts its pin.
      - run: >-
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-1854 --ignore-vuln PYSEC-2026-3042
          --ignore-vuln PYSEC-2026-3032 --ignore-vuln PYSEC-2026-3033
          --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t assurance:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: assurance:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  e2e:
    # The real UI in a browser against the real API, seeded with the two mock lab snapshots.
    runs-on: ubuntu-24.04
    needs: [frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assurance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      ASSURANCE_ENV: dev
      ASSURANCE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/assurance
      ASSURANCE_OBJECT_STORE: filesystem
      ASSURANCE_OBJECT_STORE_PATH: /tmp/objects
      ASSURANCE_MASTER_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
      ASSURANCE_COLLECTOR: mock
      ASSURANCE_JOB_BACKEND: thread
      ASSURANCE_COLLECT_JITTER_SECONDS: "0"
      ASSURANCE_BOOTSTRAP_ADMIN_PASSWORD: e2e-admin-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - run: pip install -c constraints.txt -e .
      - run: assurance-admin migrate
      - run: uvicorn --factory assurance.api.app:create_app --port 8000 > api.log 2>&1 &
      - run: python tools/e2e/seed.py http://127.0.0.1:8000 admin e2e-admin-password
      - run: npm install --no-save --prefix tools/e2e playwright@1.49.1 && npx --prefix tools/e2e playwright install --with-deps chromium
      - run: NODE_PATH=tools/e2e/node_modules node tools/e2e/smoke.cjs http://127.0.0.1:8000 admin e2e-admin-password
      - if: failure()
        run: tail -200 api.log

  proxy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate the Caddy TLS config and the Compose file
        run: |
          # Caddy loads the certificate files while validating, so give it a throwaway pair.
          mkdir -p /tmp/tls && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=assurance.example.net \
            -keyout /tmp/tls/key.pem -out /tmp/tls/cert.pem && chmod 644 /tmp/tls/*.pem
          for tls in internal "/run/tls/cert.pem /run/tls/key.pem" ops@example.net; do
            docker run --rm -e ASSURANCE_HOSTNAME=assurance.example.net -e "ASSURANCE_TLS=$tls" \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v /tmp/tls:/run/tls:ro caddy:2.8-alpine \
              caddy adapt --config /etc/caddy/Caddyfile --validate > /dev/null
          done
          cp .env.example .env && echo ASSURANCE_HOSTNAME=assurance.example.net >> .env
          docker compose config -q

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Helm v3.16.4
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Lint and render
        run: |
          C=deploy/helm/assurance
          REQ="secrets.databaseUrl=x,secrets.redisUrl=x,secrets.s3AccessKey=x,secrets.s3SecretKey=x,secrets.masterKey=x"
          helm lint "$C" --strict --set "$REQ"
          helm template ci "$C" --set "$REQ" > default.yaml
          helm template ci "$C" --set existingSecret=s,backup.enabled=true,ingress.enabled=true,api.autoscaling.enabled=true,worker.autoscaling.enabled=true > full.yaml
      - name: Validate against Kubernetes schemas
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          ~/go/bin/kubeconform -strict -summary -kubernetes-version 1.30.0 -skip ServiceMonitor default.yaml full.yaml
